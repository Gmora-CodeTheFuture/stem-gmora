services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gmora
      POSTGRES_USER: gmora
      POSTGRES_PASSWORD: secret
    ports:
      # Host 5432 is often taken by local Postgres / other stacks.
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmora -d gmora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Host 6379 commonly used by other Compose projects.
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Pin tags — Docker Hub may deny :latest pulls without login.
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gmora
      MINIO_ROOT_PASSWORD: gmorasecret
    ports:
      # Host 9000/9001 often used by other MinIO instances.
      - "9010:9000"
      - "9011:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 gmora gmorasecret;
      mc mb -p local/gmora || true;
      mc anonymous set download local/gmora/app/public || true;
      exit 0;
      "

  app:
    build: .
    image: gmora-stem:local
    command: ["web"]
    env_file: .env.docker
    environment:
      APP_ROLE: web
      RUN_MIGRATIONS: "true"
      CACHE_CONFIG: "true"
    ports:
      # Prefer 8080 when free; fall back mapping avoids clashes with other stacks.
      - "8088:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    image: gmora-stem:local
    command: ["worker"]
    env_file: .env.docker
    environment:
      APP_ROLE: worker
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "true"
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy

  scheduler:
    image: gmora-stem:local
    command: ["scheduler"]
    env_file: .env.docker
    environment:
      APP_ROLE: scheduler
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "true"
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
