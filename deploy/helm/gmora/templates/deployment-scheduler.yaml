apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gmora.fullname" . }}-scheduler
  labels:
    {{- include "gmora.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gmora.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "gmora.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: {{ include "gmora.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scheduler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["scheduler"]
          env:
            - name: APP_ROLE
              value: scheduler
            - name: RUN_MIGRATIONS
              value: "false"
            {{- include "gmora.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.scheduler | nindent 12 }}
