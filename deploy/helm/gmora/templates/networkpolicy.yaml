{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gmora.fullname" . }}
  labels:
    {{- include "gmora.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gmora.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
  egress:
    - {} # Allow DNS + managed Postgres/Redis/S3; tighten per cluster
{{- end }}
